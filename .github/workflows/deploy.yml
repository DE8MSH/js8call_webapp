name: Build and deploy JS8Web LAB
on:
  push:
    branches: [main]
    paths-ignore:
      - 'js8-core.wasm'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: js8web-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebAssembly compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Compile js8-core.wasm
        run: bash ./BAUEN.sh

      - name: Validate browser source
        run: |
          node --check app.js
          node --check ui-layout.js
          node --check rx-worker.js
          node --check protocol.js
          node --check jsc.js
          node --check jsc-tx.js
          node --check desktop-extra.js
          node tests/test.mjs
          node tests/rx-scan.mjs
          node tests/protocol-rx.mjs
          node tests/jsc.mjs
          node tests/jsc-tx.mjs

      - name: Save precompiled WASM as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: js8-core-wasm
          path: js8-core.wasm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
